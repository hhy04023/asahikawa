name: Update road status

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read official road restrictions
        run: node scripts/update-road-status.mjs
      - name: Commit refreshed road status
        run: |
          if git diff --quiet -- data/road-status.json; then
            echo "No road-status changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/road-status.json
          git commit -m "Update road status"
          git push
