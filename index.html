<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123248">
  <meta name="description" content="旭川與周邊滑雪、美食、購物地點整理。">
  <title>旭川地點清單 | ASAHIKAWA</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173449;
      --muted: #627684;
      --blue: #176a85;
      --blue-dark: #123248;
      --ice: #e8f3f5;
      --paper: #fbfcfa;
      --line: #dfe8e8;
      --orange: #e9a867;
      --shadow: 0 12px 35px rgba(25, 58, 74, .09);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #f1f5f3;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
      line-height: 1.5;
    }
    button, input, textarea, select { font: inherit; }
    .shell { width: min(100%, 920px); margin: 0 auto; padding: 16px 16px 48px; }
    .hero {
      position: relative;
      min-height: 235px;
      overflow: hidden;
      border-radius: 27px;
      background: linear-gradient(130deg, #153c54 0%, #23627a 55%, #8ab6be 100%);
      color: white;
      box-shadow: var(--shadow);
      isolation: isolate;
    }
    .hero-art { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .intro { margin: 17px 3px 16px; color: #536a77; font-size: 14px; }
    .controls { position: sticky; top: 0; z-index: 5; padding: 8px 0 11px; background: rgba(241,245,243,.94); backdrop-filter: blur(12px); }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #69828e; font-size: 18px; pointer-events: none; }
    .search {
      display: block; width: 100%; height: 49px; padding: 0 15px 0 43px; border: 1px solid var(--line);
      border-radius: 15px; outline: 0; background: white; color: var(--ink); box-shadow: 0 4px 16px rgba(24, 65, 80, .04);
    }
    .search:focus { border-color: #68aabb; box-shadow: 0 0 0 3px rgba(55, 144, 165, .12); }
    .filters { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 3px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter {
      flex: 0 0 auto; border: 1px solid #dbe5e5; border-radius: 999px; padding: 8px 13px; background: #fff;
      color: #4b6472; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .filter[aria-pressed="true"] { border-color: var(--blue-dark); background: var(--blue-dark); color: white; }
    .library-actions { display: flex; gap: 8px; margin-top: 11px; }
    .library-button { display: inline-flex; min-height: 42px; align-items: center; justify-content: center; gap: 7px; border: 1px solid #cbdedf; border-radius: 12px; padding: 0 13px; background: white; color: #315c6a; font-size: 13px; font-weight: 800; cursor: pointer; }
    .library-button.primary { border-color: var(--blue-dark); background: var(--blue-dark); color: white; }
    .tag-filters { display: flex; gap: 7px; overflow-x: auto; padding: 9px 0 1px; scrollbar-width: none; }
    .tag-filter { flex: 0 0 auto; border: 1px solid #d8e6e4; border-radius: 999px; padding: 5px 10px; background: #f7fbfa; color: #50707b; font-size: 11px; font-weight: 800; cursor: pointer; }
    .tag-filter[aria-pressed="true"] { border-color: #5c8996; background: #dceef0; color: #214d5d; }
    .results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 2px 12px; }
    .results-head h2 { margin: 0; font-size: 17px; }
    .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .card { min-width: 0; padding: 16px; border: 1px solid var(--card-border, rgba(214,226,226,.9)); border-radius: 19px; background: var(--card-bg, white); box-shadow: 0 6px 22px rgba(25,58,74,.055); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .category { color: #5e7b88; font-size: 11px; font-weight: 800; letter-spacing: .06em; }
    .title { margin: 5px 0 0; font-size: 17px; line-height: 1.28; overflow-wrap: anywhere; }
    .category-icon { flex: 0 0 76px; width: 76px; height: 76px; border-radius: 16px; object-fit: cover; box-shadow: 0 3px 10px rgba(31,58,74,.07); }
    .card-flags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .card-flag { padding: 3px 7px; border-radius: 999px; background: #edf5f2; color: #477062; font-size: 10px; font-weight: 850; }
    .card-flag.saved { background: #fceadf; color: #9b5436; }
    .cuisine-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
    .cuisine-tag { display: inline-flex; align-items: center; padding: 4px 8px; border: 1px solid #dcebe7; border-radius: 999px; background: #f1f6f4; color: #426575; font-size: 11px; font-weight: 800; }
    .desc { min-height: 40px; margin: 8px 0 0; color: #5f7079; font-size: 13px; }
    .weather-box { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 7px; margin-top: 11px; padding: 10px; border: 1px solid #e2ecea; border-radius: 12px; background: #f6faf8; }
    .weather-item { min-width: 0; color: #71838a; font-size: 10px; }
    .weather-value { display: block; margin-top: 3px; color: #254d5e; font-size: 13px; font-weight: 850; overflow-wrap: anywhere; }
    .weather-status { grid-column: 1/-1; color: #829198; font-size: 10px; }
    .rating-row { display: flex; align-items: center; gap: 7px; margin-top: 11px; font-size: 12px; }
    .rating { color: #8a551d; font-weight: 850; text-decoration: none; }
    .rating:hover { text-decoration: underline; }
    .rating-star { color: #d99645; }
    .rating-source { color: #81909a; font-size: 11px; }
    .code-row { display: flex; align-items: center; justify-content: space-between; gap: 7px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #edf1ef; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 800; letter-spacing: .015em; color: #355967; }
    .copy { flex: 0 0 auto; border: 0; border-radius: 9px; padding: 6px 9px; background: #edf4f4; color: #315c6a; font-size: 11px; font-weight: 750; cursor: pointer; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-top: 11px; }
    .map-btn { display: flex; min-height: 41px; align-items: center; justify-content: center; gap: 7px; border-radius: 11px; background: var(--blue-dark); color: white; text-decoration: none; font-size: 13px; font-weight: 800; }
    .map-btn:hover { background: #1e5972; }
    .save-btn, .tag-btn, .edit-btn, .delete-btn { min-height: 38px; border: 1px solid #d7e5e5; border-radius: 10px; background: #fff; color: #3d6675; font-size: 12px; font-weight: 800; cursor: pointer; }
    .save-btn.is-saved { border-color: #e4b29a; background: #fff2ea; color: #a25235; }
    .tag-btn { grid-column: span 1; }
    .card-tools { display: flex; gap: 7px; margin-top: 9px; }
    .card-tools button { flex: 1; }
    .empty { grid-column: 1/-1; padding: 32px 18px; border: 1px dashed #cadada; border-radius: 18px; color: var(--muted); text-align: center; }
    .note { margin: 20px 4px 0; color: #70828b; font-size: 11px; }
    .footer { margin: 27px 4px 0; padding-top: 15px; border-top: 1px solid #dbe4e2; color: #7a8b92; font-size: 11px; }
    .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 10; transform: translate(-50%, 14px); opacity: 0; padding: 10px 15px; border-radius: 999px; background: #15384d; color: white; font-size: 13px; box-shadow: var(--shadow); transition: .2s ease; pointer-events: none; }
    .toast.show { transform: translate(-50%,0); opacity: 1; }
    dialog { width: min(calc(100% - 28px), 520px); border: 0; border-radius: 20px; padding: 0; color: var(--ink); box-shadow: 0 24px 70px rgba(10,34,47,.28); }
    dialog::backdrop { background: rgba(13,35,47,.46); backdrop-filter: blur(3px); }
    .dialog-form { padding: 20px; }
    .dialog-form h2 { margin: 0 0 15px; font-size: 20px; }
    .form-grid { display: grid; gap: 12px; }
    .form-field { display: grid; gap: 5px; color: #4a6570; font-size: 12px; font-weight: 800; }
    .form-field input, .form-field select, .form-field textarea { width: 100%; border: 1px solid #d6e2e2; border-radius: 10px; padding: 10px; color: var(--ink); background: #fff; font-size: 14px; font-weight: 500; }
    .form-field textarea { min-height: 90px; resize: vertical; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .dialog-actions button { min-height: 39px; border: 1px solid #cbdedf; border-radius: 10px; padding: 0 13px; background: white; color: #315c6a; font-weight: 800; cursor: pointer; }
    .dialog-actions .submit { border-color: var(--blue-dark); background: var(--blue-dark); color: white; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 7px; margin: 4px 0 14px; }
    .tag-chip { border: 1px solid #cfe1e0; border-radius: 999px; padding: 5px 9px; background: #f3f9f7; color: #426573; font-size: 12px; font-weight: 800; cursor: pointer; }
    .tag-chip::after { content: " ×"; color: #7e969d; }
    .dialog-help { margin: -7px 0 15px; color: #70828b; font-size: 12px; }
    @media (max-width: 640px) {
      .shell { padding: 10px 12px 34px; }
      .hero { min-height: 212px; border-radius: 22px; }
      .intro { margin: 13px 3px 10px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; gap: 10px; }
      .card { padding: 15px; border-radius: 17px; }
      .category-icon { flex-basis: 66px; width: 66px; height: 66px; border-radius: 14px; }
      .title { font-size: 16px; }
      .desc { min-height: 0; }
      .library-actions { display: grid; grid-template-columns: 1fr 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero" aria-label="旭川冬季雪景封面插畫">
      <img class="hero-art" src="assets/asahikawa-winter-cover-v2.png" alt="旭川冬季旅遊插畫">
    </header>

    <p class="intro">將地點儲存到你的收藏，加入行程標籤，或建立自己的地點卡片。資料保存在目前瀏覽器。</p>

    <section class="controls" aria-label="地點搜尋與分類">
      <label class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" class="search" type="search" placeholder="搜尋地點、菜系或 MapCode" autocomplete="off" aria-label="搜尋地點、菜系或 MapCode">
      </label>
      <nav id="filters" class="filters" aria-label="地點分類"></nav>
      <nav id="tag-filters" class="tag-filters" aria-label="我的標籤"></nav>
      <div class="library-actions">
        <button id="add-place" class="library-button primary" type="button">＋ 新增地點</button>
        <button id="saved-places" class="library-button" type="button">♡ 我的收藏 <span id="saved-count"></span></button>
      </div>
    </section>

    <section id="results-section" aria-labelledby="section-title">
      <div class="results-head">
        <h2 id="section-title">旭川與近郊地點</h2>
        <span id="count" class="count" aria-live="polite"></span>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <p class="note">滑雪場卡片的天氣與氣溫為天氣模型資料，積雪深度為模型估算，非滑雪場現場實測；頁面開啟期間每 30 分鐘更新。資料來源：<a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>。食べログ分數會更新，點擊分數可查看店家頁面。MapCode 依目前行程資料整理；若地圖搜尋結果不符，請以目的地名稱與地址核對。</p>
    <footer class="footer">ASAHIKAWA · 個人旅行地點清單 · Weather data by Open-Meteo</footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="place-dialog" aria-labelledby="place-dialog-title">
    <form id="place-form" class="dialog-form">
      <h2 id="place-dialog-title">新增地點</h2>
      <div class="form-grid">
        <label class="form-field">地點名稱<input name="name" required maxlength="80" autocomplete="off"></label>
        <label class="form-field">分類<select name="group"></select></label>
        <label class="form-field">簡介<textarea name="intro" maxlength="300" placeholder="例如想吃的料理、適合安排的行程。"></textarea></label>
        <label class="form-field">MapCode<input name="code" maxlength="40" autocomplete="off"></label>
        <label class="form-field">Google Maps 連結或搜尋名稱<input name="map" maxlength="300" autocomplete="off"></label>
      </div>
      <div class="dialog-actions"><button type="button" data-close-dialog>取消</button><button class="submit" type="submit">儲存地點</button></div>
    </form>
  </dialog>
  <dialog id="tag-dialog" aria-labelledby="tag-dialog-title">
    <form id="tag-form" class="dialog-form">
      <h2 id="tag-dialog-title">管理標籤</h2>
      <p class="dialog-help">點擊標籤即可移除。</p>
      <div id="tag-list" class="tag-list"></div>
      <label class="form-field">新增標籤<input name="tag" maxlength="24" placeholder="例如 必吃、第一天、已去過" autocomplete="off"></label>
      <div class="dialog-actions"><button type="button" data-close-dialog>完成</button><button class="submit" type="submit">加入標籤</button></div>
    </form>
  </dialog>

    function readStorage(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }

    }
    function writeStorage(key, value) {
      localStorage.setItem(key, JSON.stringify(value));

    const weatherLabels = {0:"晴朗",1:"大致晴朗",2:"多雲時晴",3:"陰天",45:"霧",48:"霧凇",51:"毛毛雨",53:"中度毛毛雨",55:"強毛毛雨",56:"凍毛毛雨",57:"強凍毛毛雨",61:"小雨",63:"中雨",65:"大雨",66:"凍雨",67:"強凍雨",71:"小雪",73:"中雪",75:"大雪",77:"雪粒",80:"短暫陣雨",81:"中度陣雨",82:"強陣雨",85:"短暫陣雪",86:"強陣雪",95:"雷雨",96:"雷雨伴冰雹",99:"強雷雨伴冰雹"};
    function weatherMarkup(key) {
      return `<div class="weather-box" data-weather="${key}" aria-label="即時天氣資料"><div class="weather-item">天氣<span class="weather-value" data-wx="condition">讀取中</span></div><div class="weather-item">氣溫<span class="weather-value" data-wx="temperature">—</span></div><div class="weather-item">積雪估算<span class="weather-value" data-wx="snow">—</span></div><div class="weather-status" data-wx="status">正在取得最新模式資料…</div></div>`;
    }
    async function fetchWeather(place) {
      const cached = weatherCache.get(place.weatherKey);
      if (cached?.promise) return cached.promise;
      if (cached?.data && Date.now() - cached.fetchedAt < 30 * 60 * 1000) return cached.data;
      const [latitude, longitude] = place.coords;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&hourly=snow_depth&forecast_hours=1&past_hours=1&timezone=Asia%2FTokyo`;
      const promise = fetch(url).then(response => {
        if (!response.ok) throw new Error("weather request failed");
        return response.json();
      }).then(data => {
        const times = data.hourly?.time || [];
        let hourIndex = times.indexOf(data.current?.time);
        if (hourIndex < 0 && times.length) hourIndex = times.findIndex(t => t.slice(0, 13) === data.current?.time?.slice(0, 13));
        const snow = data.hourly?.snow_depth?.[hourIndex];
        const result = {
          condition: weatherLabels[data.current?.weather_code] || "天氣資料",
          temperature: Number.isFinite(data.current?.temperature_2m) ? `${Math.round(data.current.temperature_2m)}°C` : "暫無資料",
          snow: Number.isFinite(snow) ? `${Math.round(snow * 100)} cm` : "暫無資料",
          time: data.current?.time || ""
        };
        weatherCache.set(place.weatherKey, {data:result, fetchedAt:Date.now()});
        return result;
      }).catch(error => {
        weatherCache.delete(place.weatherKey);
        throw error;
      });
      weatherCache.set(place.weatherKey, {promise});
      return promise;
    }
    function updateWeather(visible) {
      visible.filter(p => p.weatherKey).forEach(async place => {
        const box = grid.querySelector(`[data-weather="${place.weatherKey}"]`);
        if (!box) return;
        const cached = weatherCache.get(place.weatherKey);
        if (cached?.data && Date.now() - cached.fetchedAt < 30 * 60 * 1000) {
          showWeather(box, cached.data);
          return;
        }
        try { showWeather(box, await fetchWeather(place)); }
        catch { box.querySelector('[data-wx="status"]').textContent = "目前無法載入；稍後可重新整理頁面"; }

    }

      if (!box.isConnected) return;
      box.querySelector('[data-wx="condition"]').textContent = data.condition;
      box.querySelector('[data-wx="temperature"]').textContent = data.temperature;
      box.querySelector('[data-wx="snow"]').textContent = data.snow;
      box.querySelector('[data-wx="status"]').textContent = `模型資料時間 ${data.time.replace("T", " ")}（日本時間）`;
    }
    function drawFilters() {
      filters.innerHTML = categories.map(c => `<button class="filter" type="button" aria-pressed="${selected === c}" data-category="${c}">${c}</button>`).join("");
      filters.querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
        selected = button.dataset.category;
        drawFilters();
        drawPlaces();
      }));
    }
    function drawTagFilters() {
      const tags = allTags();
      if (selectedTag !== "全部" && !tags.includes(selectedTag)) selectedTag = "全部";
      tagFilters.innerHTML = tags.length ? [`<button class="tag-filter" type="button" aria-pressed="${selectedTag === "全部"}" data-tag="全部">所有標籤</button>`, ...tags.map(tag => `<button class="tag-filter" type="button" aria-pressed="${selectedTag === tag}" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)}</button>`)].join("") : "";
      tagFilters.querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
        selectedTag = button.dataset.tag;
        drawTagFilters();
        drawPlaces();
      }));
    }
    function drawPlaces() {
      const term = search.value.trim().toLocaleLowerCase();
      const visible = allPlaces().filter(place => {
        const hasSelectedCategory = selected === "全部" || (selected === "我的收藏" ? savedPlaceIds.has(place.id) : place.group === selected);
        const hasSelectedTag = selectedTag === "全部" || tagsFor(place.id).includes(selectedTag);
        const matchesSearch = [place.name, place.group, place.cuisine || "", place.intro, place.code, ...tagsFor(place.id)].join(" ").toLocaleLowerCase().includes(term);
        return hasSelectedCategory && hasSelectedTag && matchesSearch;
      });
      if (selected === "滑雪") visible.sort((a,b) => Number(Boolean(b.skiResort)) - Number(Boolean(a.skiResort)));
      count.textContent = `${visible.length} 個地點`;
      savedCount.textContent = savedPlaceIds.size ? `(${savedPlaceIds.size})` : "";
      if (!visible.length) {
        grid.innerHTML = `<div class="empty">沒有符合的地點。試試其他分類、標籤或搜尋字詞。</div>`;
        return;
      }
      grid.innerHTML = visible.map(p => {
        const saved = savedPlaceIds.has(p.id);
        const tags = tagsFor(p.id);
        const googleMapsUrl = escapeHtml(makeMapsUrl(p.map || p.name));
        return `
        <article class="card" style="${categoryStyles[p.group]}">
          <div class="card-top">
            <div><div class="category">${escapeHtml(p.group)}</div><h3 class="title">${escapeHtml(p.name)}</h3></div>
            <img class="category-icon" src="${iconPaths[p.group]}" alt="" aria-hidden="true">
          </div>
          ${(p.builtIn ? "" : `<div class="card-flags"><span class="card-flag">自訂地點</span></div>`)}
          ${tags.length || saved ? `<div class="card-flags">${saved ? `<span class="card-flag saved">♥ 已儲存</span>` : ""}${tags.map(tag => `<span class="card-flag">${escapeHtml(tag)}</span>`).join("")}</div>` : ""}
          ${p.group === "餐廳" && p.cuisine ? `<div class="cuisine-tags" role="list" aria-label="料理類別">${p.cuisine.split(/[・/／、]/).map(tag => tag.trim()).filter(Boolean).map(tag => `<span class="cuisine-tag" role="listitem">${escapeHtml(tag)}</span>`).join("")}</div>` : ""}
          ${p.intro ? `<p class="desc">${escapeHtml(p.intro)}</p>` : ""}
          ${p.weatherKey ? weatherMarkup(p.weatherKey) : ""}
          ${p.rating ? `<div class="rating-row"><span class="rating-star" aria-hidden="true">★</span><a class="rating" href="${escapeHtml(p.tabelog)}" target="_blank" rel="noopener noreferrer" aria-label="開啟 ${escapeHtml(p.name)} 的食べログ頁面">食べログ ${escapeHtml(p.rating)}</a><span class="rating-source">點擊查看店家頁</span></div>` : ""}
          <div class="code-row"><span class="code">${p.code ? `MAPCODE ${escapeHtml(p.code)}` : "MapCode 尚未整理"}</span>${p.code ? `<button class="copy" type="button" data-code="${escapeHtml(p.code)}" aria-label="複製 ${escapeHtml(p.name)} 的 MapCode">複製</button>` : ""}</div>
          <div class="actions"><button class="save-btn ${saved ? "is-saved" : ""}" type="button" data-save="${p.id}">${saved ? "♥ 已儲存" : "♡ 儲存"}</button><button class="tag-btn" type="button" data-tags="${p.id}">標籤</button>${p.official ? `<a class="map-btn" href="${escapeHtml(p.official)}" target="_blank" rel="noopener noreferrer">↗ 滑雪場官網</a><a class="map-btn" href="${escapeHtml(p.trailMap)}" target="_blank" rel="noopener noreferrer">↗ 雪道地圖</a>` : ""}${p.map || p.name ? `<a class="map-btn" href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer">↗ Google Maps</a>` : ""}</div>
          ${p.builtIn ? "" : `<div class="card-tools"><button class="edit-btn" type="button" data-edit="${p.id}">編輯</button><button class="delete-btn" type="button" data-delete="${p.id}">刪除</button></div>`}
        </article>`;
      }).join("");
      grid.querySelectorAll(".copy").forEach(button => button.addEventListener("click", () => copyCode(button.dataset.code)));
      grid.querySelectorAll("[data-save]").forEach(button => button.addEventListener("click", () => toggleSaved(button.dataset.save)));
      grid.querySelectorAll("[data-tags]").forEach(button => button.addEventListener("click", () => openTagDialog(button.dataset.tags)));
      grid.querySelectorAll("[data-edit]").forEach(button => button.addEventListener("click", () => openPlaceDialog(button.dataset.edit)));
      grid.querySelectorAll("[data-delete]").forEach(button => button.addEventListener("click", () => deletePlace(button.dataset.delete)));
      updateWeather(visible);
    }
    async function copyCode(code) {
      try {
        await navigator.clipboard.writeText(code);
      } catch {
        const field = document.createElement("textarea"); field.value = code; field.style.position = "fixed"; field.style.opacity = "0";
        document.body.appendChild(field); field.select(); document.execCommand("copy"); field.remove();
      }
      toast.textContent = "MapCode 已複製";
      toast.classList.add("show");
      window.clearTimeout(copyCode.timer);
      copyCode.timer = window.setTimeout(() => toast.classList.remove("show"), 1700);
    }
    function announce(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(announce.timer);
      announce.timer = window.setTimeout(() => toast.classList.remove("show"), 1700);
    }
    function toggleSaved(placeId) {
      if (savedPlaceIds.has(placeId)) {
        savedPlaceIds.delete(placeId);
        announce("已從收藏移除");
      } else {
        savedPlaceIds.add(placeId);
        announce("已儲存到我的收藏");
      }
      writeStorage(storageKeys.saved, [...savedPlaceIds]);
      drawPlaces();
    }
    function openPlaceDialog(placeId) {
      const select = placeForm.elements.group;
      select.innerHTML = placeGroups.map(group => `<option value="${group}">${group}</option>`).join("");
      editingPlaceId = placeId || null;
      const place = placeId ? customPlaces.find(item => item.id === placeId) : null;
      document.querySelector("#place-dialog-title").textContent = place ? "編輯自訂地點" : "新增地點";
      placeForm.elements.name.value = place?.name || "";
      placeForm.elements.group.value = place?.group || "餐廳";
      placeForm.elements.intro.value = place?.intro || "";
      placeForm.elements.code.value = place?.code || "";
      placeForm.elements.map.value = place?.map || "";
      placeDialog.showModal();
      placeForm.elements.name.focus();
    }
    function savePlace(event) {
      event.preventDefault();
      const fields = placeForm.elements;
      const name = fields.name.value.trim();
      if (!name) return;
      const place = {name, group:fields.group.value, intro:fields.intro.value.trim(), code:fields.code.value.trim(), map:fields.map.value.trim() || name, builtIn:false};
      if (editingPlaceId) {
        const index = customPlaces.findIndex(item => item.id === editingPlaceId);
        if (index >= 0) customPlaces[index] = {...customPlaces[index], ...place};
        announce("自訂地點已更新");
      } else {
        place.id = crypto.randomUUID?.() || `custom-${Date.now()}`;
        customPlaces.push(place);
        savedPlaceIds.add(place.id);
        writeStorage(storageKeys.saved, [...savedPlaceIds]);
        announce("已新增並儲存地點");
      }
      writeStorage(storageKeys.custom, customPlaces);
      placeDialog.close();
      drawPlaces();
    }
    function deletePlace(placeId) {
      const place = customPlaces.find(item => item.id === placeId);
      if (!place || !window.confirm(`要刪除「${place.name}」嗎？`)) return;
      customPlaces = customPlaces.filter(item => item.id !== placeId);
      savedPlaceIds.delete(placeId);
      delete tagsByPlace[placeId];
      writeStorage(storageKeys.custom, customPlaces);
      writeStorage(storageKeys.saved, [...savedPlaceIds]);
      writeStorage(storageKeys.tags, tagsByPlace);
      drawTagFilters();
      drawPlaces();
      announce("自訂地點已刪除");
    }
    function openTagDialog(placeId) {
      taggingPlaceId = placeId;
      tagForm.elements.tag.value = "";
      renderTagList();
      tagDialog.showModal();
      tagForm.elements.tag.focus();
    }
    function renderTagList() {
      const tags = tagsFor(taggingPlaceId);
      tagList.innerHTML = tags.length ? tags.map(tag => `<button class="tag-chip" type="button" data-remove-tag="${escapeHtml(tag)}">${escapeHtml(tag)}</button>`).join("") : "<span class=\"dialog-help\">尚未加入標籤。</span>";
      tagList.querySelectorAll("[data-remove-tag]").forEach(button => button.addEventListener("click", () => {
        tagsByPlace[taggingPlaceId] = tagsFor(taggingPlaceId).filter(tag => tag !== button.dataset.removeTag);
        writeStorage(storageKeys.tags, tagsByPlace);
        renderTagList();
        drawTagFilters();
        drawPlaces();
      }));
    }
    function saveTag(event) {
      event.preventDefault();
      const tag = tagForm.elements.tag.value.trim();
      if (!tag || !taggingPlaceId) return;
      const tags = tagsFor(taggingPlaceId);
      if (!tags.includes(tag)) tagsByPlace[taggingPlaceId] = [...tags, tag];
      writeStorage(storageKeys.tags, tagsByPlace);
      tagForm.elements.tag.value = "";
      renderTagList();
      drawTagFilters();
      drawPlaces();
    }
    search.addEventListener("input", drawPlaces);
    document.querySelector("#add-place").addEventListener("click", () => openPlaceDialog());
    document.querySelector("#saved-places").addEventListener("click", () => {
      selected = "我的收藏";
      drawFilters();
      drawPlaces();
    });
    placeForm.addEventListener("submit", savePlace);
    tagForm.addEventListener("submit", saveTag);
    document.querySelectorAll("[data-close-dialog]").forEach(button => button.addEventListener("click", () => button.closest("dialog").close()));
    drawFilters();
    drawTagFilters();
    drawPlaces();
    setInterval(() => {
      const activeKeys = [...grid.querySelectorAll("[data-weather]")].map(box => box.dataset.weather);
      const activePlaces = allPlaces().filter(place => activeKeys.includes(place.weatherKey));
      activePlaces.forEach(place => weatherCache.delete(place.weatherKey));
      updateWeather(activePlaces);
    }, 30 * 60 * 1000);
  </script>
</body>
</html>
