    :root {

      --paper: #fbfcfa;
      --line: #dfe8e8;
      --orange: #e9a867;
      --shadow: 0 12px 35px rgba(25, 58, 74, .09);

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #f1f5f3;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;

    button, input { font: inherit; }
    .shell { width: min(100%, 920px); margin: 0 auto; padding: 16px 16px 48px; }
    .hero {
      position: relative;
      min-height: 235px;
      overflow: hidden;
      border-radius: 27px;
      background: linear-gradient(130deg, #153c54 0%, #23627a 55%, #8ab6be 100%);
      color: white;
      box-shadow: var(--shadow);
      isolation: isolate;
    }
    .hero-art { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; }
    .hero-copy { position: absolute; inset: auto 24px 23px; z-index: 1; text-shadow: 0 2px 14px rgba(9, 33, 47, .32); }
    .eyebrow { margin: 0 0 7px; font-size: 11px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; opacity: .88; }

    .intro { margin: 17px 3px 16px; color: #536a77; font-size: 14px; }
    .controls { position: sticky; top: 0; z-index: 5; padding: 8px 0 11px; background: rgba(241,245,243,.94); backdrop-filter: blur(12px); }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #69828e; font-size: 18px; pointer-events: none; }
    .search {
      display: block; width: 100%; height: 49px; padding: 0 15px 0 43px; border: 1px solid var(--line);
      border-radius: 15px; outline: 0; background: white; color: var(--ink); box-shadow: 0 4px 16px rgba(24, 65, 80, .04);

    .search:focus { border-color: #68aabb; box-shadow: 0 0 0 3px rgba(55, 144, 165, .12); }
    .filters { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 3px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter {
      flex: 0 0 auto; border: 1px solid #dbe5e5; border-radius: 999px; padding: 8px 13px; background: #fff;
      color: #4b6472; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .filter[aria-pressed="true"] { border-color: var(--blue-dark); background: var(--blue-dark); color: white; }
    .results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 2px 12px; }
    .results-head h2 { margin: 0; font-size: 17px; }
    .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .card { min-width: 0; padding: 16px; border: 1px solid rgba(214,226,226,.9); border-radius: 19px; background: white; box-shadow: 0 6px 22px rgba(25,58,74,.055); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .category { color: #5e7b88; font-size: 11px; font-weight: 800; letter-spacing: .06em; }
    .title { margin: 5px 0 0; font-size: 17px; line-height: 1.28; overflow-wrap: anywhere; }
    .emoji { display: grid; flex: 0 0 37px; width: 37px; height: 37px; place-items: center; border-radius: 12px; background: var(--ice); font-size: 19px; }
    .cuisine { display: inline-block; margin: 11px 0 0; padding: 4px 8px; border-radius: 999px; background: #f1f6f4; color: #426575; font-size: 11px; font-weight: 800; }
    .desc { min-height: 40px; margin: 8px 0 0; color: #5f7079; font-size: 13px; }
    .rating-row { display: flex; align-items: center; gap: 7px; margin-top: 11px; font-size: 12px; }
    .rating { color: #8a551d; font-weight: 850; text-decoration: none; }
    .rating:hover { text-decoration: underline; }
    .rating-star { color: #d99645; }
    .rating-source { color: #81909a; font-size: 11px; }
    .code-row { display: flex; align-items: center; justify-content: space-between; gap: 7px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #edf1ef; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 800; letter-spacing: .015em; color: #355967; }
    .copy { flex: 0 0 auto; border: 0; border-radius: 9px; padding: 6px 9px; background: #edf4f4; color: #315c6a; font-size: 11px; font-weight: 750; cursor: pointer; }
    .actions { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 11px; }
    .map-btn { display: flex; min-height: 41px; align-items: center; justify-content: center; gap: 7px; border-radius: 11px; background: var(--blue-dark); color: white; text-decoration: none; font-size: 13px; font-weight: 800; }
    .map-btn:hover { background: #1e5972; }
    .empty { grid-column: 1/-1; padding: 32px 18px; border: 1px dashed #cadada; border-radius: 18px; color: var(--muted); text-align: center; }
    .note { margin: 20px 4px 0; color: #70828b; font-size: 11px; }
    .footer { margin: 27px 4px 0; padding-top: 15px; border-top: 1px solid #dbe4e2; color: #7a8b92; font-size: 11px; }
    .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 10; transform: translate(-50%, 14px); opacity: 0; padding: 10px 15px; border-radius: 999px; background: #15384d; color: white; font-size: 13px; box-shadow: var(--shadow); transition: .2s ease; pointer-events: none; }
    .toast.show { transform: translate(-50%,0); opacity: 1; }
    @media (max-width: 640px) {

      .hero-copy { inset: auto 20px 20px; }

      .grid { grid-template-columns: 1fr; gap: 10px; }
      .card { padding: 15px; border-radius: 17px; }
      .title { font-size: 16px; }

</head>

      {name:"SPA & SAUNA オスパー", group:"溫泉休閒", icon:"🧖", intro:"旭川市區的溫浴與桑拿設施。", code:"79 314 838*22", map:"SPA & SAUNA オスパー, Asahikawa, Hokkaido"},
      {name:"天然温泉かぐらの湯", group:"溫泉休閒", icon:"♨️", intro:"神樂一帶的天然溫泉，可安排自駕返市區前後造訪。", code:"79 343 522*34", map:"天然温泉かぐらの湯, Asahikawa, Hokkaido"},
      {name:"杜のSPA神楽", group:"溫泉休閒", icon:"♨️", intro:"神樂區的溫浴休閒設施，適合滑雪後放鬆。", code:"79 313 109*68", map:"杜のSPA神楽, Asahikawa, Hokkaido"},
      {name:"旭川高砂台 万葉の湯", group:"溫泉休閒", icon:"♨️", intro:"高砂台一帶的溫浴休閒設施。", code:"79 367 055*25", map:"Asahikawa Takasagodai Manyonoyu, Hokkaido"},
      {name:"Kitoushi Forest Kitoron", group:"溫泉休閒", icon:"🌲", intro:"東川町近郊的森林休閒與日歸溫泉設施。", code:"389 500 847*31", map:"Kitoushi Forest Kitoron, Higashikawa, Hokkaido"},

      {name:"民宿（Night In Daiya）", group:"住宿", icon:"🏠", intro:"依你的指定，這筆住宿以 Night In Daiya 作為 Google Maps 搜尋名稱。", code:"79 343 751*70", map:"Night In Daiya, Asahikawa, Hokkaido"},
      {name:"旭川機場", group:"交通", icon:"✈️", intro:"旭川進出與租車行程的機場位置。", code:"79 025 007*16", map:"Asahikawa Airport, Hokkaido, Japan"}
    ];

    const categories = ["全部", "餐廳", "滑雪場", "購物", "溫泉休閒", "住宿", "交通"];
    let selected = "全部";
    const filters = document.querySelector("#filters");
    const grid = document.querySelector("#grid");
    const search = document.querySelector("#search");
    const count = document.querySelector("#count");
    const toast = document.querySelector("#toast");

    function makeMapsUrl(query) {
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
    }
    function drawFilters() {
      filters.innerHTML = categories.map(c => `<button class="filter" type="button" aria-pressed="${selected === c}" data-category="${c}">${c}</button>`).join("");
      filters.querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
        selected = button.dataset.category;
        drawFilters();
        drawPlaces();
      }));
    }
    function drawPlaces() {
      const term = search.value.trim().toLocaleLowerCase();
      const visible = places.filter(p => (selected === "全部" || p.group === selected) &&
        [p.name, p.group, p.cuisine || "", p.intro, p.code].join(" ").toLocaleLowerCase().includes(term));
      count.textContent = `${visible.length} 個地點`;
      if (!visible.length) {
        grid.innerHTML = `<div class="empty">沒有找到符合的地點。試試其他名稱或分類。</div>`;
        return;
      }
      grid.innerHTML = visible.map((p, i) => `
        <article class="card">
          <div class="card-top">
            <div><div class="category">${p.group}</div><h3 class="title">${p.name}</h3></div>
            <span class="emoji" aria-hidden="true">${p.icon}</span>
          </div>
          ${p.cuisine ? `<div class="cuisine">${p.cuisine}</div>` : ""}
          <p class="desc">${p.intro}</p>
          ${p.rating ? `<div class="rating-row"><span class="rating-star" aria-hidden="true">★</span><a class="rating" href="${p.tabelog}" target="_blank" rel="noopener noreferrer" aria-label="開啟 ${p.name} 的食べログ頁面">食べログ ${p.rating}</a><span class="rating-source">點擊查看店家頁</span></div>` : ""}
          <div class="code-row"><span class="code">MAPCODE ${p.code}</span><button class="copy" type="button" data-code="${p.code}" aria-label="複製 ${p.name} 的 MapCode">複製</button></div>
          <div class="actions"><a class="map-btn" href="${makeMapsUrl(p.map)}" target="_blank" rel="noopener noreferrer">↗ 開啟 Google Maps</a></div>
        </article>`).join("");
      grid.querySelectorAll(".copy").forEach(button => button.addEventListener("click", () => copyCode(button.dataset.code)));
    }
    async function copyCode(code) {
      try {
        await navigator.clipboard.writeText(code);
      } catch {
        const field = document.createElement("textarea"); field.value = code; field.style.position = "fixed"; field.style.opacity = "0";
        document.body.appendChild(field); field.select(); document.execCommand("copy"); field.remove();
      }
      toast.textContent = "MapCode 已複製";
      toast.classList.add("show");
      window.clearTimeout(copyCode.timer);
      copyCode.timer = window.setTimeout(() => toast.classList.remove("show"), 1700);
    }
    search.addEventListener("input", drawPlaces);
    drawFilters();
    drawPlaces();
  </script>
</body>
</html>
